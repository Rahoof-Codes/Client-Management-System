<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101f" />
      <stop offset="100%" stop-color="#0a0a12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="url(#cGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized Modern 'C' Letter -->
  <path d="M 43 21 C 39.5 16.5 33.5 15 28 17 C 20.5 19.5 16 26.5 16 34 C 16 41.5 20.5 48.5 28 51 C 33.5 53 39.5 51.5 43 47" 
        stroke="url(#cGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#glow)" />
        
  <!-- Glowing Dot Accent -->
  <circle cx="43" cy="21" r="3.5" fill="#38bdf8" />
</svg>